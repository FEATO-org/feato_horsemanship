name: Manual build and release

'on':
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build and tag (for example, 0.2.0)'
        type: string
        required: true
        default: '0.1.0'
      publish_release:
        description: 'Create a tag and publish a GitHub Release'
        type: boolean
        required: true
        default: false

concurrency:
  group: feato-horsemanship-manual-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      BUILD_VERSION: ${{ inputs.version }}
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Check release branch
        if: inputs.publish_release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "Releases must run from the default branch: $DEFAULT_BRANCH" >&2
            exit 1
          fi
      - name: Validate requested version
        id: version
        run: |
          if [[ ! "$BUILD_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $BUILD_VERSION" >&2
            exit 1
          fi
          echo "value=$BUILD_VERSION" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: ./gradlew --no-daemon -PbuildVersion="$BUILD_VERSION" clean build
      - name: Stage release files
        run: |
          jar="build/libs/feato-horsemanship-${BUILD_VERSION}.jar"
          test -f "$jar"
          mkdir -p dist
          cp "$jar" src/main/resources/horsemanship.yml dist/
          (cd dist && sha256sum "feato-horsemanship-${BUILD_VERSION}.jar" horsemanship.yml > SHA256SUMS)
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: feato-horsemanship-${{ steps.version.outputs.value }}
          path: dist/
          if-no-files-found: error

  release:
    if: inputs.publish_release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out release commit and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Download verified build
        uses: actions/download-artifact@v8
        with:
          name: feato-horsemanship-${{ needs.build.outputs.version }}
          path: dist
      - name: Verify release files and create tag
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="v$RELEASE_VERSION"
          (cd dist && sha256sum --check SHA256SUMS)
          existing="$(git rev-parse -q --verify "refs/tags/$tag^{commit}" 2>/dev/null || true)"
          if [[ -n "$existing" && "$existing" != "$GITHUB_SHA" ]]; then
            echo "Tag $tag already points to a different commit" >&2
            exit 1
          fi
          if [[ -z "$existing" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$tag" "$GITHUB_SHA" -m "FEATO Horsemanship $tag"
            git push origin "refs/tags/$tag"
          fi
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="v$RELEASE_VERSION"
          release_flags=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then release_flags+=(--prerelease); fi
          gh release create "$tag" dist/* \
            --verify-tag \
            --title "FEATO Horsemanship $tag" \
            --generate-notes "${release_flags[@]}"
